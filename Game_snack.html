<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>精美贪吃蛇 · 完整版优化</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 12px;
  }

  h1 {
    font-size: 22px;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(94, 234, 212, 0.45);
  }

  .info-panel {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 16px;
    font-weight: 600;
  }
  .info-item {
    color: #9fd8ff;
  }

  #gameCanvas {
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0, 180, 255, 0.35);
    background-color: #0b1320;
    max-width: 95vw;
    height: auto;
    display: block;
  }

  .map-name {
    margin-top: 10px;
    font-size: 14px;
    color: #ffe066;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255, 224, 102, 0.35);
  }

  .btn-group {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }

  button {
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #00adb5, #007b85);
    color: #fff;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0, 173, 181, 0.35);
  }
  button:active {
    transform: translateY(0px);
  }

  /* ========== 自定义下拉，彻底解决文字截断 ========== */
  .custom-select {
    position: relative;
    width: 130px;
  }
  .select-head {
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    background: linear-gradient(135deg, #00adb5, #007b85);
    cursor: pointer;
    user-select: none;
  }
  .select-head:active {
    transform: translateY(0);
  }
  .select-drop {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: max-content;
    min-width: 100%;
    background: #007b85;
    border-radius: 8px;
    z-index: 99;
    overflow: hidden;
    display: none;
  }
  .select-drop.open {
    display: block;
  }
  .select-option {
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .select-option:hover {
    background: #00adb5;
  }
  .select-option.checked::before {
    content: "✓ ";
  }

  .volume-wrap {
    display: flex;
    align-items: center;
    gap:6px;
  }
  #volume {
    width:80px;
  }

  .tip {
    margin-top:14px;
    opacity:0.7;
    font-size:13px;
    text-align:center;
    line-height:1.6;
  }

  /* 浮层弹窗 */
  .overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    display:none;
  }
  .overlay.show {
    display:flex;
  }
  .modal {
    background:#16213e;
    padding:24px 30px;
    border-radius:14px;
    text-align:center;
  }
  .modal h3 {
    margin-bottom:12px;
    color:#ffe066;
  }
  .modal p {
    margin-bottom:16px;
  }
  .flash-gold {
    animation:goldFlash 0.35s ease;
  }
  @keyframes goldFlash {
    0% { box-shadow: 0 0 0 20px rgba(255,215,0,0.55); }
    100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
  }
</style>
</head>

<body>
  <h1>🐍 精美贪吃蛇</h1>
  <div class="info-panel">
    <div class="info-item">分数：<span id="score">0</span></div>
    <div class="info-item">最高分：<span id="high">0</span></div>
    <div class="info-item">长度：<span id="len">1</span></div>
    <div class="info-item">时长：<span id="time">0</span>s</div>
  </div>

  <canvas id="gameCanvas" width="420" height="420"></canvas>
  <div class="map-name" id="mapName">当前地图：原野地图</div>

  <div class="btn-group">
    <button id="startBtn">开始 / 暂停</button>
    <button id="resetBtn">重新开始</button>

    <div class="custom-select" id="levelWrap">
      <div class="select-head" id="levelHead">普通</div>
      <div class="select-drop" id="levelDrop">
        <div class="select-option" data-val="180">简单（慢速）</div>
        <div class="select-option checked" data-val="130">普通</div>
        <div class="select-option" data-val="90">困难</div>
        <div class="select-option" data-val="60">地狱（极速）</div>
      </div>
    </div>

    <button id="musicBtn">音乐：关</button>
    <div class="volume-wrap">
      <span>音量</span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="0.4">
    </div>

    <div class="custom-select" id="mapWrap">
      <div class="select-head" id="mapHead">原野地图</div>
      <div class="select-drop" id="mapDrop">
        <div class="select-option checked" data-val="plain">原野地图</div>
        <div class="select-option" data-val="maze">十字迷宫</div>
        <div class="select-option" data-val="ring">环形岛屿</div>
        <div class="select-option" data-val="grid">方格陷阱</div>
      </div>
    </div>
  </div>

  <div class="tip">
    电脑：方向键 ↑ ↓ ← → ｜空格=启停  R=重置  M=音乐<br>
    手机：画布滑动控制｜边界穿墙，障碍物不可穿过
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>游戏结束</h3>
      <p>本次得分：<span id="finalScore">0</span></p>
      <button id="modalReset">再来一局</button>
    </div>
  </div>

<script>
// ========== 常量区 ==========
const SIZE = 20;
const CANVAS_RAW = 420;
const COUNT = CANVAS_RAW / SIZE;
const MAP_CONFIG = {
  plain: { name:"原野地图", wallColor:null, gen:()=>[] },
  maze: {
    name:"十字迷宫",
    wallColor:["#736699","#423466"],
    gen:()=>{
      const w=[];
      for(let r=3;r<=17;r++) w.push({x:7*SIZE,y:r*SIZE});
      for(let c=2;c<=18;c++) w.push({x:c*SIZE,y:10*SIZE});
      return w;
    }
  },
  ring:{
    name:"环形岛屿",
    wallColor:["#447799","#224466"],
    gen:()=>{
      const w=[];
      // 外圈围墙
      for(let c=2;c<=18;c++){
        w.push({x:c*SIZE,y:2*SIZE});
        w.push({x:c*SIZE,y:18*SIZE});
      }
      for(let r=2;r<=18;r++){
        w.push({x:2*SIZE,y:r*SIZE});
        w.push({x:18*SIZE,y:r*SIZE});
      }
      // 内圈围墙，中间开通道（第10列断开，连通内外环）
      for(let c=5;c<=15;c++){
        if(c !== 10) {
          w.push({x:c*SIZE,y:5*SIZE});
          w.push({x:c*SIZE,y:15*SIZE});
        }
      }
      for(let r=5;r<=15;r++){
        if(r !== 10) {
          w.push({x:5*SIZE,y:r*SIZE});
          w.push({x:15*SIZE,y:r*SIZE});
        }
      }
      return w;
    }
  },
  grid:{
    name:"方格陷阱",
    wallColor:["#886644","#553322"],
    gen:()=>{
      const pos=[
        [3,3],[10,3],[17,3],
        [3,7],[10,7],[17,7],
        [3,14],[10,14],[17,14],
        [6,10],[14,10],[8,12],[12,12]
      ];
      return pos.map(([c,r])=>({x:c*SIZE,y:r*SIZE}));
    }
  }
};

// ========== DOM ==========
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highEl = document.getElementById("high");
const lenEl = document.getElementById("len");
const timeEl = document.getElementById("time");
const mapNameEl = document.getElementById("mapName");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const musicBtn = document.getElementById("musicBtn");
const volumeInput = document.getElementById("volume");
const overlay = document.getElementById("overlay");
const finalScoreEl = document.getElementById("finalScore");
const modalResetBtn = document.getElementById("modalReset");

// 自定义下拉
const levelWrap = document.getElementById("levelWrap");
const levelHead = document.getElementById("levelHead");
const levelDrop = document.getElementById("levelDrop");
const mapWrap = document.getElementById("mapWrap");
const mapHead = document.getElementById("mapHead");
const mapDrop = document.getElementById("mapDrop");

// ========== 状态 ==========
let snake = [];
let food = {};
let isGoldFruit = false;
let dx = SIZE, dy = 0;
let lastDx = SIZE, lastDy = 0;
let score = 0;
let highScore = 0;
let gameLoop = null;
let running = false;
let touchStartX = 0, touchStartY = 0;
let foodBlinkTimer = 0;
let musicOn = false;
let volume = 0.4;
let currentMapId = "plain";
let walls = [];
let startTime = null;
let deathFlash = 0;
let bgmTimer = null;

// 音频
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume*0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function playEat(){ playTone(520,0.08); playTone(650,0.12); }
function playGoldEat(){ playTone(580,0.07); playTone(720,0.07); playTone(900,0.14); }
function playDie(){ playTone(320,0.12); playTone(280,0.12); playTone(220,0.18); }

// BGM旋律
const bgmMelody = [330,392,440,392,330,294,262];
let bgmNoteIndex = 0;
function playBgmNote(){
  if(!musicOn || !running) return;
  playTone(bgmMelody[bgmNoteIndex],0.22);
  bgmNoteIndex = (bgmNoteIndex + 1) % bgmMelody.length;
}
function startBGM(){
  stopBGM();
  bgmTimer = setInterval(playBgmNote, 280);
}
function stopBGM(){
  clearInterval(bgmTimer);
}

// ========== 本地存储容错 ==========
function saveStorage(key,val){
  try { localStorage.setItem(key,val); }catch(e){}
}
function loadStorage(key,def){
  try {
    const v = localStorage.getItem(key);
    return v===null ? def : v;
  }catch(e){ return def; }
}
highScore = Number(loadStorage("snakeHigh",0));
highEl.textContent = highScore;
musicOn = loadStorage("snakeMusic","false")==="true";
volume = Number(loadStorage("snakeVol",0.4));
volumeInput.value = volume;
musicBtn.textContent = musicOn ? "音乐：开" : "音乐：关";

// ========== 下拉绑定 ==========
function bindSelect(wrap,head,drop,onChange){
  head.onclick = ()=>{
    drop.classList.toggle("open");
  };
  document.addEventListener("click",(e)=>{
    if(!wrap.contains(e.target)) drop.classList.remove("open");
  });
  const opts = drop.querySelectorAll(".select-option");
  opts.forEach(opt=>{
    opt.onclick = ()=>{
      opts.forEach(o=>o.classList.remove("checked"));
      opt.classList.add("checked");
      head.textContent = opt.textContent;
      drop.classList.remove("open");
      onChange(opt.dataset.val);
    }
  })
}
bindSelect(levelWrap, levelHead, levelDrop, (v)=>{
  if(running){
    clearInterval(gameLoop);
    gameLoop = setInterval(update, Number(v));
  }
});
bindSelect(mapWrap, mapHead, mapDrop, (v)=>{
  currentMapId = v;
  resetGame();
});

// ========== 地图加载 ==========
function loadMap(mapId){
  const cfg = MAP_CONFIG[mapId];
  walls = cfg.gen();
  mapNameEl.textContent = "当前地图："+cfg.name;
}

// ========== 食物生成（防死循环） ==========
function spawnFood(){
  let ok = false;
  let tryCnt = 0;
  const MAX_TRY = 800;
  while(!ok && tryCnt < MAX_TRY){
    const c = Math.floor(Math.random()*COUNT);
    const r = Math.floor(Math.random()*COUNT);
    food.x = c*SIZE; food.y = r*SIZE;
    const onWall = walls.some(w=>w.x===food.x && w.y===food.y);
    const onSnake = snake.some(s=>s.x===food.x && s.y===food.y);
    ok = !onWall && !onSnake;
    tryCnt++;
  }
  isGoldFruit = Math.random() < 0.2;
}

// ========== 初始化蛇 ==========
function initSnake(){
  snake = [ {x:6*SIZE,y:6*SIZE} ];
  dx = SIZE; dy = 0;
  lastDx = SIZE; lastDy = 0;
  score = 0;
  scoreEl.textContent = score;
  lenEl.textContent = snake.length;
  startTime = Date.now();
  spawnFood();
  deathFlash = 0;
}

// ========== 绘制 ==========
function draw(){
  ctx.clearRect(0,0,CANVAS_RAW,CANVAS_RAW);
  drawGrid();
  drawWalls();
  drawSnake();
  drawFood();
}
function drawGrid(){
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for(let i=0;i<=COUNT;i++){
    ctx.beginPath();
    ctx.moveTo(i*SIZE,0); ctx.lineTo(i*SIZE,CANVAS_RAW); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,i*SIZE); ctx.lineTo(CANVAS_RAW,i*SIZE); ctx.stroke();
  }
}
function drawWalls(){
  const cfg = MAP_CONFIG[currentMapId];
  let c1="#636691",c2="#32345a";
  if(cfg.wallColor){ [c1,c2]=cfg.wallColor; }
  walls.forEach(w=>{
    const grad = ctx.createLinearGradient(w.x,w.y,w.x+SIZE,w.y+SIZE);
    grad.addColorStop(0,c1); grad.addColorStop(1,c2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(w.x+1,w.y+1,SIZE-2,SIZE-2,5);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth=1; ctx.stroke();
  })
}
function drawSnake(){
  snake.forEach((seg,idx)=>{
    if(deathFlash>0 && deathFlash%10<5){
      ctx.globalAlpha=0.4;
    }
    if(idx===0){
      ctx.fillStyle="#5eead4";
      ctx.beginPath();
      ctx.roundRect(seg.x+1,seg.y+1,SIZE-2,SIZE-2,7);
      ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(seg.x+SIZE/2, seg.y+SIZE/2-2, 2,0,Math.PI*2);
      ctx.fill();
    }else{
      const ratio = Math.min(idx/snake.length,1);
      const r = Math.floor(30 + ratio*40);
      const g = Math.floor(140 - ratio*40);
      const b = Math.floor(220 - ratio*60);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.roundRect(seg.x+1,seg.y+1,SIZE-2,SIZE-2,5);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  })
}
function drawFood(){
  foodBlinkTimer++;
  const alpha = 0.6 + Math.sin(foodBlinkTimer*0.12)*0.4;
  if(isGoldFruit){
    ctx.fillStyle=`rgba(255,215,0,${alpha*0.25})`;
    ctx.beginPath();
    ctx.arc(food.x+SIZE/2, food.y+SIZE/2, SIZE/2+4,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=`rgba(255,215,0,${alpha})`;
  }else{
    ctx.fillStyle=`rgba(255,107,107,${alpha})`;
  }
  ctx.beginPath();
  ctx.arc(food.x+SIZE/2, food.y+SIZE/2, SIZE/2-2,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.5)";
  ctx.beginPath();
  ctx.arc(food.x+SIZE/2-2, food.y+SIZE/2-2,1.8,0,Math.PI*2);
  ctx.fill();
}

// ========== 更新逻辑 ==========
function update(){
  if(deathFlash>0){
    deathFlash++;
    if(deathFlash>35){
      running=false;
      stopBGM();
      overlay.classList.add("show");
      finalScoreEl.textContent = score;
      return;
    }
    draw();
    return;
  }
  const head = { x:snake[0].x + dx, y:snake[0].y + dy };
  // 穿墙
  if(head.x <0) head.x = CANVAS_RAW - SIZE;
  if(head.x >= CANVAS_RAW) head.x = 0;
  if(head.y <0) head.y = CANVAS_RAW - SIZE;
  if(head.y >= CANVAS_RAW) head.y = 0;

  // 撞墙 / 撞自己
  const hitWall = walls.some(w=>w.x===head.x && w.y===head.y);
  const hitSelf = snake.some(s=>s.x===head.x && s.y===head.y);
  if(hitWall || hitSelf){
    playDie();
    deathFlash=1;
    stopBGM();
    draw();
    return;
  }

  snake.unshift(head);
  if(head.x === food.x && head.y === food.y){
    if(isGoldFruit){
      score +=25;
      snake.push({...head}, {...head});
      playGoldEat();
      canvas.classList.add("flash-gold");
      setTimeout(()=>canvas.classList.remove("flash-gold"),350);
    }else{
      score +=10;
      playEat();
    }
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
    spawnFood();
  }else{
    snake.pop();
  }
  // 更新时长
  const sec = Math.floor((Date.now()-startTime)/1000);
  timeEl.textContent = sec;
  lastDx = dx; lastDy = dy;
  draw();
}

// ========== 控制（禁止反向掉头） ==========
function setDir(ndx, ndy){
  if(ndx === -lastDx && ndy === -lastDy) return;
  dx = ndx; dy = ndy;
}

// 键盘
document.addEventListener("keydown",e=>{
  if(e.key === " "){
    e.preventDefault(); toggleRun(); return;
  }
  if(e.key.toLowerCase()==="r"){ resetGame(); return; }
  if(e.key.toLowerCase()==="m"){ toggleMusic(); return; }
  if(!running) return;
  if(e.key==="ArrowUp") setDir(0,-SIZE);
  else if(e.key==="ArrowDown") setDir(0,SIZE);
  else if(e.key==="ArrowLeft") setDir(-SIZE,0);
  else if(e.key==="ArrowRight") setDir(SIZE,0);
})

// 触屏修复
canvas.addEventListener("touchstart",e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
})
canvas.addEventListener("touchend",e=>{
  if(!running) return;
  const ex = e.changedTouches[0].clientX;
  const ey = e.changedTouches[0].clientY;
  const dt = ex-touchStartX;
  const dyT = ey-touchStartY;
  if(Math.abs(dt) > Math.abs(dyT)){
    if(dt>20) setDir(SIZE,0);
    else if(dt<-20) setDir(-SIZE,0);
  }else{
    if(dyT>20) setDir(0,SIZE);
    else if(dyT<-20) setDir(0,-SIZE);
  }
})

// ========== 按钮 ==========
function toggleRun(){
  if(!running){
    running=true;
    if(!startTime) startTime=Date.now();
    gameLoop = setInterval(update, Number(levelDrop.querySelector(".checked").dataset.val));
    if(musicOn) startBGM();
  }else{
    running=false;
    clearInterval(gameLoop);
    stopBGM();
  }
}
function resetGame(){
  clearInterval(gameLoop);
  running=false;
  stopBGM();
  overlay.classList.remove("show");
  loadMap(currentMapId);
  initSnake();
  draw();
}
function toggleMusic(){
  musicOn = !musicOn;
  musicBtn.textContent = musicOn ? "音乐：开" : "音乐：关";
  saveStorage("snakeMusic", musicOn);
  if(musicOn && audioCtx.state === "suspended") audioCtx.resume();
  if(musicOn && running){
    startBGM();
  }else{
    stopBGM();
  }
}
volumeInput.oninput = ()=>{
  volume = Number(volumeInput.value);
  saveStorage("snakeVol", volume);
}

startBtn.onclick = toggleRun;
resetBtn.onclick = resetGame;
musicBtn.onclick = toggleMusic;
modalResetBtn.onclick = resetGame;

// 初始化
loadMap(currentMapId);
initSnake();
draw();
</script>
</body>
</html>
